    Research, prototyping and development of a deep learning based environmental seismic event classification project.
    Preparation, pre-processing, augmentation, and feature extraction for ML training on acoustic data.
    <br>
    <a href="https://huggingface.co/docs/transformers/en/perf_train_gpu_many">Multi-GPU training</a> and utilization of Docker containers on an <a href="https://www.nvidia.com/en-in/data-center/dgx-1/">NVIDIA DGX</a> system.
    Model optimization via <a href="https://developer.nvidia.com/tensorrt">TensorRT</a> and <a href="https://www.st.com/en/embedded-software/x-cube-ai.html">X-CUBE AI</a>.
